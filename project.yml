name: VoiceChess
options:
  bundleIdPrefix: com.louissentinella
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
packages:
  VoiceChessCore:
    path: Packages/VoiceChessCore
targets:
  VoiceChess:
    type: application
    platform: iOS
    sources:
      - VoiceChess
    dependencies:
      - package: VoiceChessCore
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Voice Chess
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: Voice Chess listens to your spoken chess moves.
        NSSpeechRecognitionUsageDescription: Voice Chess converts your spoken moves to text so it can play them.
        UIBackgroundModes:
          - audio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.louissentinella.voicechess
        PRODUCT_NAME: VoiceChess
        MARKETING_VERSION: "0.5"
        CURRENT_PROJECT_VERSION: "5"
        TARGETED_DEVICE_FAMILY: "1"
