name: VoiceChess
options:
  bundleIdPrefix: com.louissentinella
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  VoiceChess:
    type: application
    platform: iOS
    sources:
      - VoiceChess
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.louissentinella.voicechess
        PRODUCT_NAME: VoiceChess
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Voice Chess
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
