[project]
name = "voicechess-server"
version = "0.1.0"
description = "Game state, move validation and engine opponents for Voice Chess Coach"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "chess>=1.11",
    "kokoro-onnx>=0.6.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["voicechess_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
